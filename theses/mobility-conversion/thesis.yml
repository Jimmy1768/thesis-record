phase_ledger:
  - phase: 1
    name: framing_and_methodology_scaffolding
    status: complete
    note: accepted as formation-stage source truth, not final empirical methodology.
  - phase: 2
    name: source_and_candidate_feasibility
    status: complete
    note: bounded eight-lead source and candidate feasibility is closed for this intake.
  - phase: 3
    name: boundary_geometry_validation
    status: complete
    note: feature-level validation passed for the four committed Minneapolis and Portland layers.
  - phase: 4
    name: population_joins_and_metric_pre_admission
    status: complete
    note: ACS tract population acquisition and read-only TIGER join passed checksum, one-to-one coverage, and reproducibility review as provisional input only.
  - phase: 5
    name: candidate_admission_comparison_and_scoring
    status: active_next
    note: only bounded substage 5A boundary-record construction and readiness review is open; admission, ledger, comparison, and scoring remain closed.

phase_5_substages:
  - substage: 5A
    name: boundary_record_construction_and_readiness_review
    workflow_mapping:
      - stage_4_boundary_record_creation
      - stage_5_boundary_fit_review
      - stage_6_data_alignment_review
    status: active_next
    note: >
      Create only source-led, non-selected boundary records with
      record_status not_admitted, using already accepted repository evidence
      and keeping unknowns explicit.
  - substage: 5B
    name: admission_review_and_live_candidate_universe_ledger
    workflow_mapping:
      - stage_7_admission_review
      - stage_8_candidate_universe_ledger
    status: closed
    note: >
      Remains closed until at least one complete boundary record passes every
      required gate and reaches admissible_for_candidate_universe.
  - substage: 5C
    name: comparison_scoring_ranking_and_final_selection
    status: closed
    note: >
      Remains closed. No current source-truth authority permits comparison,
      scoring, ranking, final selection, or publication claims.

current_next_step:
  status: bounded_phase_5a_boundary_record_construction_and_readiness_review_active_next
  action: >
    Phase 5 is now active_next only for bounded substage 5A under the existing
    candidate-universe workflow. The next exact implementation unit is two
    source-led, non-selected proposed-MTR boundary records: one for
    Minneapolis-St. Paul ERS commuting zone and one for
    Portland-Vancouver-Hillsboro CBSA. Each record must be created from
    already accepted repository evidence only, must begin with record_status
    not_admitted, must keep unknowns explicit, and must leave readiness or
    admission checklist booleans false unless directly supported. This is
    boundary-record construction and readiness review only, not admission.
  not_allowed: >
    Do not admit MTRs, create a candidate list, create a live
    candidate-universe ledger, create outcome metric records, calculate
    scores, rank MTRs, compare MTRs, select final cases, or claim any accepted
    population, denominator, metric, comparison, ranking, selection, or
    publication result. Record U.S. evidence/tooling convenience as a bias risk
    rather than as merit.
