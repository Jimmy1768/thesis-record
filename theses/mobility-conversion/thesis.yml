slug: mobility-conversion
title: Mobility Conversion
full_title: "Mobility Conversion: How Metropolitan Transport Regions Convert Capacity, Pressure, Shape, Governance, and Growth into Usable Access"
category: Transport / Urban Systems / Regional Governance
status: candidate_formation
thesis_number: 2
public_path:

unit_of_analysis:
  name: Metropolitan Transport Region
  abbreviation: MTR
  status: requires_operational_definition

research_question: >
  Why do some Metropolitan Transport Regions convert resources, constraints,
  institutional arrangements, and growth conditions into usable access better
  than others?

outcome:
  name: usable_access_performance
  status: candidate_dimensions_not_scored
  dimensions:
    - access_to_opportunities
    - network_coverage_and_service_availability
    - travel_time_and_reliability
    - transportation_safety
    - affordability
    - walking_cycling_and_universal_access
    - asset_condition_and_resilience

explanatory_axes:
  status: explanatory_not_score_components
  axes:
    - economic_capacity
    - demand_intensity
    - urban_form
    - governance_fit
    - growth_maturity

external_research_inputs:
  status: smoke_test_only
  rule: >
    Prompt results, query-test outputs, and ChatGPT Deep Research returns are
    not evidence, source truth, accepted methodology, or accepted MTR selection.
    They may only generate questions, source leads, candidate definitions, or
    rejected material until independently processed inside ThesisRecord.

boundaries:
  - Do not treat this as a country ranking.
  - Do not treat this as a GDP ranking.
  - Do not treat this as a livability index.
  - Do not treat this as relocation advice.
  - Do not treat this as a best-transit-cities list.
  - Do not use the transit-region expansion of MTR.
  - Do not select MTRs from reputation, fame, congestion narrative, walkability reputation, or intuition.
  - Do not calculate final scores during candidate formation.
  - Keep explanatory axes separate from outcome dimensions.

paths:
  source_truth: theses/mobility-conversion/source_truth
  research: theses/mobility-conversion/research
  evidence: theses/mobility-conversion/evidence
  paper: theses/mobility-conversion/paper
  operator_records: theses/mobility-conversion/operator_records

