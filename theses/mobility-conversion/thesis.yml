current_next_step:
  status: blocked_between_extraction_tooling_and_acs_api_verification
  action: >
    The TIGER 2024 tract/block-group geometry raw ZIPs for Minnesota,
    Wisconsin, Oregon, and Washington have been archived under the manifest,
    checksummed, ZIP-integrity tested, and reviewed for shapefile schemas,
    geography keys, feature counts, and coordinate reference metadata. A
    geometry-only boundary-alignment plan now defines county FIPS filters and
    tract/block-group escalation rules. Current local blockers are: no GIS
    extraction tooling in the system or bundled runtimes, and ACS API access
    still failing locally with curl TLS code 35. Next work should either enable
    extraction tooling for processed geometry or verify ACS API rows from a
    working environment. Do this without creating filled boundary records,
    candidate-universe ledgers, metric records, scores, rankings, accepted
    denominator values, or accepted population values.
  not_allowed: >
    Do not admit MTRs, create a candidate list, create a candidate-universe
    ledger, create outcome metric records, calculate scores, rank MTRs, or
    archive raw evidence without a manifest.
